name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target builds on a native runner: no cross toolchain needed for
          # the CMake/C++ build of transcribe-cpp-sys.
          - os: macos-latest      # arm64 runner
            target: aarch64-apple-darwin
          - os: macos-15-intel    # x86_64 runner
            target: x86_64-apple-darwin
          - os: ubuntu-latest     # x86_64 runner
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm  # arm64 runner
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (CMake + C++ toolchain)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          name="handy-transcribe-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/handy-transcribe" "dist/${name}/"
          cp LICENSE README.md README.zh-CN.md "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" >/dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" 2>/dev/null || \
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          body: |
            Offline speech-to-text CLI. Prebuilt binaries:

            | Platform | Asset |
            |---|---|
            | macOS arm64 | `*-aarch64-apple-darwin.tar.gz` |
            | macOS x86_64 | `*-x86_64-apple-darwin.tar.gz` |
            | Linux x86_64 | `*-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux arm64 | `*-aarch64-unknown-linux-gnu.tar.gz` |

            Or install from source: `cargo install handy-transcribe`

            Verify the download with the matching `.sha256` file.
