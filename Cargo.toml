[package]
name = "handy-transcribe"
version = "0.1.2"
rust-version = "1.85"
edition = "2021"
authors = ["cyub"]
description = "Offline speech-to-text CLI: transcribe audio files or URLs locally with Handy's transcribe.cpp pipeline"
repository = "https://github.com/cyub/handy-transcribe"
homepage = "https://github.com/cyub/handy-transcribe"
readme = "README.md"
license = "MIT"
keywords = ["asr", "speech-to-text", "transcription", "whisper", "offline"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/.github", "/.agents", "/docs", "/DESIGN.md"]
default-run = "handy-transcribe"

[[bin]]
name = "handy-transcribe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
sha2 = "0.10"
dirs = "5"

# Audio decoding: same stack as Handy's decode.rs (mp3/wav/flac/ogg/aac/m4a/aiff...).
symphonia = { version = "0.5.5", features = ["aac", "alac", "isomp4", "mp3", "aiff"] }
# Resample any sample rate to 16 kHz.
rubato = "5"

# The transcription engine (whisper.cpp / ggml "transcribe.cpp" Rust binding).
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["serde"] }

# HTTP: download audio from URLs and models from Hugging Face.
reqwest = { version = "0.12", features = ["blocking"] }

# Native library. Pin to the version matching the transcribe-cpp 0.4.0
# bindings, and enable the platform GPU backend the way Handy does:
# Metal on macOS, CPU-only elsewhere (add vulkan/dynamic-backends for Linux
# GPU support if desired).
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp-sys = { version = "=0.4.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp-sys = { version = "=0.4.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Let `cargo binstall handy-transcribe` fetch the prebuilt tarballs from GitHub
# releases instead of compiling. Asset naming is produced by
# .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
